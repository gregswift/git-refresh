name: release-please

on:
  push:
    branches: [main]

# release-please opens a pull request and, once that lands, creates the tag and
# the GitHub release. Both need write access; the job does nothing else.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
